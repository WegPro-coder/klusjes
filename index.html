<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klusjesrooster Wegter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: één smalle kolom als prikbord op de koelkast; dagdelen als tegels, week als raster van dagkaarten */
:root {
  --bg: #eef2f7;
  --surface: #ffffff;
  --ink: #17233a;
  --muted: #5b6880;
  --line: #d6deea;
  --accent: #1f4fa3;          /* Delfts blauw */
  --accent-soft: #dfe8f8;
  --done: #2f7d4f;
  --done-soft: #e2f2e8;
  --late: #c0392b;
  --late-soft: #fbe4e1;
  --parent: #7a5a12;
  --parent-soft: #f6ecd2;
  --k1: #d9485f; --k2: #e08a1e; --k3: #2a9d8f; --k4: #6c4ab6; --k5: #2b6cb0;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Nunito Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1522; --surface: #182133; --ink: #e8edf6; --muted: #9aa6bd; --line: #2a3650;
    --accent: #7fa6ef; --accent-soft: #1e2d4d; --done: #6cc792; --done-soft: #17362a;
    --late: #ff7b6b; --late-soft: #3d1c1a; --parent: #e3c06a; --parent-soft: #3a3018;
    --k1: #f07489; --k2: #f0a54a; --k3: #4cc3b4; --k4: #a385e8; --k5: #6ea4e6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1522; --surface: #182133; --ink: #e8edf6; --muted: #9aa6bd; --line: #2a3650;
  --accent: #7fa6ef; --accent-soft: #1e2d4d; --done: #6cc792; --done-soft: #17362a;
  --late: #ff7b6b; --late-soft: #3d1c1a; --parent: #e3c06a; --parent-soft: #3a3018;
  --k1: #f07489; --k2: #f0a54a; --k3: #4cc3b4; --k4: #a385e8; --k5: #6ea4e6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
}
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex; flex-direction: column; gap: 18px;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
.top .datum { color: var(--muted); font-weight: 600; margin-top: 4px; }
.ouderknop {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 8px 14px; font-weight: 700; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px;
}
.ouderknop.aan { background: var(--parent-soft); border-color: var(--parent); color: var(--parent); }

.demo { background: var(--parent-soft); color: var(--parent); border-radius: var(--radius); padding: 10px 14px; font-size: 0.9rem; font-weight: 600; }

.pinvak { background: var(--surface); border: 1.5px solid var(--parent); border-radius: var(--radius); padding: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pinvak label { font-weight: 700; }
.pinvak input { width: 8em; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); letter-spacing: 0.3em; }
.pinvak .fout { color: var(--late); font-weight: 600; width: 100%; }
.pinvak.kind { border-color: var(--accent); }
#pinform .pf { display: grid; grid-template-columns: minmax(0, 14em) minmax(0, 11em); gap: 10px; align-items: center; }
#pinform label { font-weight: 700; }
#pinform input { padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); letter-spacing: 0.3em; min-width: 0; }
#pinform input::placeholder { letter-spacing: normal; }
#pinform .fout { color: var(--late); font-weight: 600; }
.pfknop { padding-top: 4px; }
.ik { margin-left: auto; font-size: 0.88rem; color: var(--muted); font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
.ik button { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 2px 0; text-decoration: underline; }
.taak.vreemd .vink { opacity: 0.4; cursor: not-allowed; }

.balk { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.tabs { display: inline-flex; background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; }
.tabs button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; font-weight: 700; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.weeknav { display: inline-flex; align-items: center; gap: 6px; }
.weeknav button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; width: 36px; height: 36px; font-size: 1.1rem; font-weight: 700; }
.weeknav span { font-weight: 700; min-width: 8.5em; text-align: center; font-size: 0.95rem; }
.badge { display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--parent-soft); color: var(--parent); vertical-align: middle; }

.wie { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.wie .lbl { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.chip {
  --c: var(--muted);
  border: 2px solid var(--c); color: var(--c); background: transparent;
  border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 0.92rem;
}
.chip[aria-pressed="true"] { background: var(--c); color: var(--surface); }

.dagdelen { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; align-items: start; }
.dagdeel { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; }
.dagdeel header { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px 8px; border-bottom: 1px solid var(--line); }
.dagdeel header h2 { font-size: 1.25rem; font-weight: 800; }
.dagdeel header small { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.leeg { color: var(--muted); padding: 14px 16px; font-style: italic; }

.taak { border-bottom: 1px solid var(--line); }
.taak:last-child { border-bottom: 0; }
.taak .rij { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.vink {
  flex: none; width: 34px; height: 34px; border-radius: 9px; border: 2.5px solid var(--line);
  background: var(--surface); display: grid; place-items: center; padding: 0;
}
.vink svg { width: 20px; height: 20px; stroke: var(--surface); opacity: 0; }
.taak.gedaan .vink, .taak.ziek .vink { background: var(--done); border-color: var(--done); }
.taak.gedaan .vink svg, .taak.ziek .vink svg { opacity: 1; }
.taak.ouder .vink { background: var(--parent-soft); border-color: var(--parent); }
.taak.laat { background: var(--late-soft); }
.taak.laat .vink { border-color: var(--late); }
.tekst { flex: 1; min-width: 0; }
.tekst .naam { font-weight: 700; }
.taak.gedaan .tekst .naam, .taak.ziek .tekst .naam { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.tekst .sub { font-size: 0.85rem; color: var(--muted); }
.taak.laat .tekst .sub { color: var(--late); font-weight: 700; }
.taak.ouder .tekst .sub { color: var(--parent); font-weight: 700; }
.kind { --c: var(--muted); flex: none; font-weight: 800; font-size: 0.85rem; color: var(--surface); background: var(--c); border-radius: 999px; padding: 3px 10px; }
.meer { flex: none; border: 1.5px solid var(--line); background: transparent; border-radius: 8px; width: 34px; height: 34px; font-weight: 800; color: var(--muted); }
.acties { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 14px 62px; }
.acties button, .acties select { border: 1.5px solid var(--parent); background: var(--parent-soft); color: var(--parent); border-radius: 8px; padding: 6px 10px; font-size: 0.88rem; font-weight: 700; }

.week { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.dag { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.dag.vandaag { border: 2px solid var(--accent); }
.dag h3 { font-size: 1.05rem; font-weight: 800; display: flex; justify-content: space-between; align-items: baseline; }
.dag h3 small { font-family: var(--font-body); color: var(--muted); font-weight: 600; font-size: 0.8rem; }
.dag .ddl { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.wr { display: flex; align-items: center; gap: 8px; font-size: 0.92rem; }
.wr .stip { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.wr .tn { flex: 1; min-width: 0; }
.wr .kn { font-weight: 700; color: var(--c); }
.wr.gedaan .tn, .wr.ziek .tn { text-decoration: line-through; color: var(--muted); }
.wr.laat .tn { color: var(--late); font-weight: 700; }
.wr.ouder .kn::after { content: ' · ouder'; color: var(--parent); }

.punten { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.punten h2 { font-size: 1.1rem; font-weight: 800; }
.punten p { margin: 0; color: var(--muted); font-size: 0.88rem; max-width: 65ch; }
.pr { display: grid; grid-template-columns: 4.5em 1fr 4.5em; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
.pr .n { font-weight: 700; }
.pr .bar { height: 12px; background: var(--bg); border-radius: 999px; overflow: hidden; }
.pr .bar i { display: block; height: 100%; background: var(--c); border-radius: 999px; }
.pr .v { text-align: right; color: var(--muted); font-weight: 600; font-size: 0.9rem; }
.pr .v.tot { color: var(--ink); font-weight: 800; font-size: 1.05rem; }
.pr.kop { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.pr .barwrap { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pr .uitleg { font-size: 0.8rem; color: var(--muted); }
.punten .klein { font-size: 0.8rem; }
.verdeling summary { cursor: pointer; font-weight: 700; color: var(--muted); font-size: 0.88rem; }
.verdeling p { margin-top: 6px; }
.taak.matig .tekst .sub { color: var(--parent); font-weight: 700; }
.taak.matig .vink { background: var(--parent); border-color: var(--parent); }
.wr.matig .kn::after { content: ' · −½'; color: var(--parent); }

.melding { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; max-width: calc(100% - 32px); }
.laden { color: var(--muted); padding: 30px 0; }
@media (max-width: 480px) {
  .acties { padding-left: 16px; }
  .weeknav span { min-width: 7em; }
}
@media (prefers-reduced-motion: no-preference) {
  .vink, .chip, .tabs button { transition: background .15s, border-color .15s, color .15s; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div>
      <h1>Klusjesrooster</h1>
      <div class="datum" id="datum"></div>
    </div>
    <button class="ouderknop" id="ouderknop" type="button">🔒 Ouders</button>
  </div>

  <div class="demo" id="demo" hidden></div>

  <form class="pinvak" id="pinvak" hidden>
    <label for="pin">Ouder-pincode</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <button class="ouderknop" type="submit">Ontgrendel</button>
    <div class="fout" id="pinfout" hidden>Deze pincode klopt niet. Probeer het opnieuw.</div>
  </form>

  <form class="pinvak kind" id="kindvak" hidden>
    <label for="kindpin" id="kindlabel">Jouw pincode</label>
    <input id="kindpin" type="password" inputmode="numeric" autocomplete="off">
    <button class="ouderknop" type="submit">Ok</button>
    <button class="ouderknop" type="button" id="kindannuleer">Annuleer</button>
    <div class="fout" id="kindfout" hidden>Deze pincode klopt niet. Probeer het opnieuw.</div>
  </form>

  <div class="balk">
    <div class="tabs" role="group" aria-label="Weergave">
      <button type="button" id="tab-vandaag" aria-pressed="true">Vandaag</button>
      <button type="button" id="tab-week" aria-pressed="false">Week</button>
      <button type="button" id="tab-pincodes" aria-pressed="false" hidden>Pincodes</button>
    </div>
    <div class="weeknav" id="weeknav" hidden>
      <button type="button" id="vorige" aria-label="Vorige week">‹</button>
      <span id="weeklabel"></span>
      <button type="button" id="volgende" aria-label="Volgende week">›</button>
    </div>
  </div>

  <div class="wie" id="wie"></div>
  <main id="inhoud"><div class="laden">Rooster laden…</div></main>
</div>
<div class="melding" id="melding" hidden></div>

<script>
(function () {
  // ===== Plak hieronder tussen de aanhalingstekens de web-app-URL van Apps Script (eindigt op /exec) =====
  const API_URL = 'https://script.google.com/macros/s/AKfycbygI_IWsQ-pOZ3g7-dts4dMqkEARD4woN6ECJbZjKjFjHrQRKCif8TbHVV5JeuWOGZwMg/exec';

  const DEMO = !!window.KLUSJES_DEMO;
  const KLEUREN = ['var(--k1)', 'var(--k2)', 'var(--k3)', 'var(--k4)', 'var(--k5)'];
  const DAGEN = ['maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag', 'zondag'];
  const MAANDEN = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
  const VINK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  const st = { view: 'vandaag', offset: 0, data: null, pin: null, filter: null, open: null, ik: null, wacht: null };
  try { st.ik = JSON.parse(localStorage.getItem('klusjes-ik') || 'null'); } catch (e) {}
  try { st.filter = localStorage.getItem('klusjes-wie') || null; } catch (e) {}
  try { st.pin = sessionStorage.getItem('klusjes-pin') || null; } catch (e) {}

  // ---- verbinding met de achterkant ----
  function roep(naam) {
    const args = Array.prototype.slice.call(arguments, 1);
    if (DEMO) {
      return new Promise((ok, nok) => { try { ok(JSON.parse(JSON.stringify(window[naam].apply(null, args)))); } catch (e) { nok(e); } });
    }
    if (window.google && google.script && google.script.run) {
      // geopend via de Google-link
      return new Promise((ok, nok) => {
        google.script.run.withSuccessHandler(ok).withFailureHandler(nok)[naam].apply(null, args);
      });
    }
    // geopend via GitHub Pages: vraag het aan Google via de web-app-URL
    if (API_URL.indexOf('https://') !== 0) {
      return Promise.reject(new Error('De web-app-URL is nog niet ingevuld in index.html'));
    }
    return fetch(API_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify({ fn: naam, args: args }) })
      .then(r => { if (!r.ok) throw new Error('Google is even niet bereikbaar'); return r.json(); })
      .then(a => { if (!a.ok) throw new Error(a.fout); return a.data; });
  }

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function kleur(naam) { const i = st.data.kinderen.findIndex(k => k.naam === naam); return KLEUREN[i % KLEUREN.length]; }
  function parse(s) { const p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
  function plus(s, n) { const d = parse(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function dagNaam(s) { const w = (parse(s).getUTCDay() + 6) % 7; return DAGEN[w]; }
  function kort(s) { const d = parse(s); return d.getUTCDate() + ' ' + MAANDEN[d.getUTCMonth()]; }

  let meldTimer;
  function meld(tekst) {
    const m = $('melding'); m.textContent = tekst; m.hidden = false;
    clearTimeout(meldTimer); meldTimer = setTimeout(() => m.hidden = true, 2600);
  }

  function isLaat(it) {
    if (it.status !== 'open') return false;
    const d = st.data;
    if (it.datum < d.vandaag) return true;
    if (it.datum > d.vandaag) return false;
    const grens = eindTijd(it);
    return grens != null && d.uurNu >= grens;
  }
  function eindTijd(it) {
    if (it.klaarVoor !== undefined) return it.klaarVoor;
    const dd = st.data.dagdelen.find(x => x.id === it.dagdeel);
    return dd && dd.eindUur != null ? dd.eindUur : null;
  }
  function getal(n) { return (Math.round(n * 10) / 10).toString().replace('.', ','); }
  function tijd(u) { const h = Math.floor(u), m = Math.round((u - h) * 60); return h + ':' + (m < 10 ? '0' : '') + m; }
  function klasse(it) { return it.status + (isLaat(it) ? ' laat' : ''); }

  async function laad() {
    try {
      st.data = await roep('haalOverzicht', st.offset);
      teken();
    } catch (e) {
      $('inhoud').innerHTML = '<div class="leeg">Het rooster kon niet geladen worden: ' + esc(e.message || e) + '. Ververs de pagina om het opnieuw te proberen.</div>';
    }
  }

  // ---- tekenen ----
  function teken() {
    const d = st.data;
    $('datum').textContent = dagNaam(d.vandaag).replace(/^./, c => c.toUpperCase()) + ' ' + kort(d.vandaag);
    $('ouderknop').classList.toggle('aan', !!st.pin);
    $('ouderknop').textContent = st.pin ? '🔓 Ouders (aan)' : '🔒 Ouders';
    $('tab-vandaag').setAttribute('aria-pressed', st.view === 'vandaag');
    $('tab-week').setAttribute('aria-pressed', st.view === 'week');
    if (st.view === 'pincodes' && !st.pin) st.view = 'vandaag';
    $('tab-pincodes').hidden = !st.pin;
    $('tab-pincodes').setAttribute('aria-pressed', st.view === 'pincodes');
    $('wie').hidden = st.view === 'pincodes';
    $('weeknav').hidden = st.view !== 'week';
    const lbl = st.offset === 0 ? 'Deze week' : st.offset === 1 ? 'Volgende week' : st.offset === -1 ? 'Vorige week' : 'Week van ' + kort(d.maandag);
    $('weeklabel').innerHTML = esc(lbl) + (d.voorlopig ? ' <span class="badge">voorlopig</span>' : '');

    $('wie').innerHTML = '<span class="lbl">Wie ben jij?</span>' +
      '<button type="button" class="chip" data-wie="" aria-pressed="' + (!st.filter) + '">Iedereen</button>' +
      d.kinderen.map(k => '<button type="button" class="chip" style="--c:' + kleur(k.naam) + '" data-wie="' + esc(k.naam) + '" aria-pressed="' + (st.filter === k.naam) + '">' + esc(k.naam) + '</button>').join('') +
      (st.ik ? '<span class="ik">Ingelogd als ' + esc(st.ik.naam) + ' <button type="button" id="afmelden">Afmelden</button></span>' : '');

    if (st.view === 'pincodes') {
      // het formulier niet opnieuw tekenen als het er al staat (dan blijft wat je typt staan)
      if (!$('pinform')) $('inhoud').innerHTML = tekenPincodes();
      return;
    }
    $('inhoud').innerHTML = st.view === 'vandaag' ? tekenVandaag() : tekenWeek();
  }

  function filterItems(items) { return st.filter ? items.filter(it => it.kind === st.filter) : items; }

  function tekenVandaag() {
    const d = st.data;
    if (st.offset !== 0) { st.offset = 0; laad(); return '<div class="laden">Rooster laden…</div>'; }
    const vandaagItems = filterItems(d.items.filter(it => it.datum === d.vandaag));
    return '<div class="dagdelen">' + d.dagdelen.map(dd => {
      const items = vandaagItems.filter(it => it.dagdeel === dd.id);
      return '<section class="dagdeel"><header><h2>' + esc(dd.naam) + '</h2></header>' +
        (items.length ? items.map(taakRij).join('') : '<div class="leeg">' + (st.filter ? 'Geen klusjes voor ' + esc(st.filter) + '.' : 'Geen klusjes.') + '</div>') +
        '</section>';
    }).join('') + '</div>';
  }

  function subTekst(it) {
    if (it.status === 'ouder') return 'Overgenomen door een ouder';
    if (it.status === 'ziek') return 'Ziek · gedaan door een ouder';
    const grens = eindTijd(it);
    const tijdTekst = grens != null ? 'vóór ' + tijd(grens) : '';
    if (it.beoordeling === 'matig') return 'Niet goed of mopperend · ' + getal(1 - st.data.aftrek) + ' punt';
    const delen = [it.notitie, tijdTekst].filter(Boolean);
    if (isLaat(it)) delen.push('nog niet gedaan');
    return delen.join(' · ');
  }

  function taakRij(it) {
    const open = st.open === it.id && st.pin && !st.data.voorlopig;
    let acties = '';
    if (open) {
      acties = '<div class="acties">' +
        (it.status === 'gedaan' ? (it.beoordeling === 'matig'
          ? '<button type="button" data-actie="goed" data-id="' + esc(it.id) + '">Toch goed gedaan</button>'
          : '<button type="button" data-actie="matig" data-id="' + esc(it.id) + '">Niet goed of mopperend (−½)</button>') : '') +
        '<button type="button" data-actie="ouder" data-id="' + esc(it.id) + '">Ouder nam over</button>' +
        '<button type="button" data-actie="ziek" data-id="' + esc(it.id) + '">Ziek, ouder deed het</button>' +
        '<select data-actie="geef" data-id="' + esc(it.id) + '" aria-label="Geef aan ander kind"><option value="">Geef aan…</option>' +
        st.data.kinderen.filter(k => k.naam !== it.kind).map(k => '<option>' + esc(k.naam) + '</option>').join('') + '</select>' +
        (it.status !== 'open' ? '<button type="button" data-actie="open" data-id="' + esc(it.id) + '">Terug naar open</button>' : '') +
        '</div>';
    }
    const sub = subTekst(it);
    const vreemd = st.ik && !st.pin && it.kind !== st.ik.naam;
    return '<div class="taak ' + klasse(it) + (vreemd ? ' vreemd' : '') + (it.beoordeling === 'matig' ? ' matig' : '') + '">' +
      '<div class="rij">' +
      '<button type="button" class="vink" data-actie="vink" data-id="' + esc(it.id) + '" aria-label="' + esc(it.naam) + (it.status === 'gedaan' ? ' – gedaan' : ' – afvinken') + '"' + (st.data.voorlopig ? ' disabled' : '') + '>' + VINK + '</button>' +
      '<div class="tekst"><div class="naam">' + esc(it.naam) + '</div>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div>' +
      '<span class="kind" style="--c:' + kleur(it.kind) + '">' + esc(it.kind) + '</span>' +
      (st.pin && !st.data.voorlopig ? '<button type="button" class="meer" data-actie="meer" data-id="' + esc(it.id) + '" aria-label="Meer opties" aria-expanded="' + open + '">⋯</button>' : '') +
      '</div>' + acties + '</div>';
  }

  function tekenWeek() {
    const d = st.data;
    if (!d.bestaat && !d.voorlopig) return '<div class="leeg">Voor deze week is geen rooster bewaard.</div>';
    let html = '<div class="week">';
    for (let i = 0; i < 7; i++) {
      const datum = plus(d.maandag, i);
      const items = filterItems(d.items.filter(it => it.datum === datum));
      html += '<div class="dag' + (datum === d.vandaag ? ' vandaag' : '') + '"><h3>' + dagNaam(datum).replace(/^./, c => c.toUpperCase()) + ' <small>' + kort(datum) + '</small></h3>';
      d.dagdelen.forEach(dd => {
        const r = items.filter(it => it.dagdeel === dd.id);
        if (!r.length) return;
        html += '<div class="ddl">' + esc(dd.naam) + '</div>' + r.map(it =>
          '<div class="wr ' + klasse(it) + (it.beoordeling === 'matig' ? ' matig' : '') + '" style="--c:' + kleur(it.kind) + '"><span class="stip"></span><span class="tn">' + esc(it.naam) + '</span><span class="kn">' + esc(it.kind) + '</span></div>').join('');
      });
      if (!items.length) html += '<div class="leeg" style="padding:0">Geen klusjes.</div>';
      html += '</div>';
    }
    html += '</div>';

    // puntentelling: gedane taken, min aftrek
    const sw = d.scoreWeek, stot = d.scoreTotaal;
    const max = Math.max.apply(null, d.kinderen.map(k => d.kinderen.length && sw[k.naam] ? sw[k.naam].score : 0).concat([1]));
    html += '<section class="punten" style="margin-top:14px"><h2>Puntentelling</h2>' +
      '<p>Elke gedane klus levert 1 punt op. Is een klus niet goed of mopperend gedaan, dan gaat er ' + getal(d.aftrek) + ' punt af.</p>' +
      '<div class="pr kop"><span></span><span>' + (d.voorlopig ? 'volgende week' : 'deze week') + '</span><span class="v">totaal</span></div>' +
      d.kinderen.map(k => {
        const r = sw[k.naam] || { score: 0, gedaan: 0, matig: 0 };
        const t = stot[k.naam] || { score: 0 };
        const uitleg = r.gedaan + ' gedaan' + (r.matig ? ', ' + r.matig + '× aftrek' : '');
        return '<div class="pr" style="--c:' + kleur(k.naam) + '"><span class="n">' + esc(k.naam) + '</span>' +
          '<span class="barwrap"><span class="bar"><i style="width:' + (r.score / max * 100) + '%"></i></span><span class="uitleg">' + getal(r.score) + ' pt · ' + uitleg + '</span></span>' +
          '<span class="v tot">' + getal(t.score) + '</span></div>';
      }).join('') +
      '<p class="klein">Totaal = de laatste ' + d.wekenOnthouden + ' weken.</p>' +
      '<details class="verdeling"><summary>Verdeling van het werk</summary><p>Zo is het werk verdeeld (stofzuigen telt hier dubbel, Julie en Bas krijgen ongeveer 1,25× zoveel): ' +
      d.kinderen.map(k => esc(k.naam) + ' ' + (d.puntenWeek[k.naam] || 0)).join(' · ') + '.</p></details>' +
      '</section>';
    return html;
  }

  function tekenPincodes() {
    const rij = (id, label) => '<div class="pf"><label for="pf-' + esc(id) + '">' + esc(label) + '</label>' +
      '<input id="pf-' + esc(id) + '" data-wie="' + esc(id) + '" type="password" inputmode="numeric" autocomplete="new-password" placeholder="nieuwe code"></div>';
    return '<form class="punten" id="pinform"><h2>Pincodes wijzigen</h2>' +
      '<p>Vul alleen in wat je wilt veranderen; lege vakjes blijven zoals ze zijn. Een pincode is 4 tot 8 cijfers, en elke pincode moet anders zijn. Deze pincodes blijven bewaard, ook als je later nieuwe code plakt.</p>' +
      rij('ouder', 'Ouders (Manon en Jorn)') +
      st.data.kinderen.map(k => rij(k.naam, k.naam)).join('') +
      '<div class="pfknop"><button type="submit" class="ouderknop aan">Pincodes opslaan</button></div>' +
      '<div class="fout" id="pfout" hidden></div>' +
      '</form>';
  }

  document.addEventListener('submit', async e => {
    if (e.target.id !== 'pinform') return;
    e.preventDefault();
    const nieuw = {};
    e.target.querySelectorAll('input[data-wie]').forEach(i => { if (i.value.trim()) nieuw[i.dataset.wie] = i.value.trim(); });
    if (!Object.keys(nieuw).length) return meld('Je hebt nog geen nieuwe pincode ingevuld');
    try {
      await roep('wijzigPincodes', st.pin, nieuw);
    } catch (x) {
      $('pfout').textContent = x.message || String(x); $('pfout').hidden = false; return;
    }
    if (nieuw.ouder) { st.pin = nieuw.ouder; try { sessionStorage.setItem('klusjes-pin', st.pin); } catch (x) {} }
    if (st.ik && nieuw[st.ik.naam]) { st.ik.pin = nieuw[st.ik.naam]; try { localStorage.setItem('klusjes-ik', JSON.stringify(st.ik)); } catch (x) {} }
    e.target.querySelectorAll('input').forEach(i => i.value = '');
    $('pfout').hidden = true;
    meld('Pincodes opgeslagen: ' + Object.keys(nieuw).map(n => n === 'ouder' ? 'ouders' : n).join(', '));
  });

  // ---- acties ----
  async function actie(fn, args, tekst) {
    try {
      await roep.apply(null, [fn].concat(args));
      if (tekst) meld(tekst);
      await laad();
    } catch (e) {
      const m = e.message || String(e);
      // pincode van het kind is veranderd: opnieuw laten invullen
      if (m.indexOf('Vul eerst je pincode in') >= 0) { st.ik = null; try { localStorage.removeItem('klusjes-ik'); } catch (x) {} teken(); }
      meld(m);
    }
  }

  function vraagKindPin(naam, daarna) {
    st.wacht = { naam: naam, daarna: daarna };
    $('kindlabel').textContent = 'Ben jij ' + naam + '? Vul je pincode in';
    $('kindfout').hidden = true;
    $('kindvak').hidden = false;
    $('kindpin').value = '';
    $('kindpin').focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  $('kindvak').addEventListener('submit', async e => {
    e.preventDefault();
    if (!st.wacht) return;
    const pin = $('kindpin').value.trim();
    let ok = false;
    try { ok = await roep('controleerKindPin', st.wacht.naam, pin); } catch (x) {}
    if (!ok) { $('kindfout').hidden = false; return; }
    st.ik = { naam: st.wacht.naam, pin: pin };
    try { localStorage.setItem('klusjes-ik', JSON.stringify(st.ik)); } catch (x) {}
    $('kindvak').hidden = true; $('kindpin').value = '';
    const daarna = st.wacht.daarna; st.wacht = null;
    daarna();
  });

  document.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'tab-vandaag') { st.view = 'vandaag'; st.offset = 0; return laad(); }
    if (b.id === 'tab-week') { st.view = 'week'; return teken(); }
    if (b.id === 'tab-pincodes') { st.view = 'pincodes'; return teken(); }
    if (b.id === 'vorige') { st.offset--; return laad(); }
    if (b.id === 'volgende') { st.offset++; return laad(); }
    if (b.id === 'ouderknop') {
      if (st.pin) {
        st.pin = null; st.open = null; try { sessionStorage.removeItem('klusjes-pin'); } catch (x) {}
        meld('Ouder-modus uit'); return teken();
      }
      $('pinvak').hidden = !$('pinvak').hidden; if (!$('pinvak').hidden) $('pin').focus(); return;
    }
    if (b.id === 'afmelden') {
      st.ik = null; try { localStorage.removeItem('klusjes-ik'); } catch (x) {}
      meld('Afgemeld'); return teken();
    }
    if (b.id === 'kindannuleer') { st.wacht = null; $('kindvak').hidden = true; return; }
    if (b.dataset.wie !== undefined) {
      st.filter = b.dataset.wie || null;
      try { st.filter ? localStorage.setItem('klusjes-wie', st.filter) : localStorage.removeItem('klusjes-wie'); } catch (x) {}
      return teken();
    }
    const id = b.dataset.id, a = b.dataset.actie;
    if (!a) return;
    const it = st.data.items.find(x => x.id === id);
    if (a === 'vink') {
      if (it.status === 'ouder' || it.status === 'ziek') {
        if (!st.pin) return meld('Alleen ouders kunnen dit veranderen');
        return actie('zetStatus', [id, 'open', st.pin, null], 'Teruggezet');
      }
      const nieuw = it.status === 'gedaan' ? 'open' : 'gedaan';
      const doe = () => actie('zetStatus', [id, nieuw, st.pin, st.ik], nieuw === 'open' ? 'Vinkje weggehaald' : 'Goed gedaan, ' + it.kind + '!');
      if (!st.pin) {
        if (!st.ik) return vraagKindPin(it.kind, doe);
        if (st.ik.naam !== it.kind) return meld('Dit is een klusje van ' + it.kind + '. Je kunt alleen je eigen klusjes afvinken.');
      }
      return doe();
    }
    if (a === 'meer') { st.open = st.open === id ? null : id; return teken(); }
    if (a === 'ouder') { st.open = null; return actie('zetStatus', [id, 'ouder', st.pin], 'Genoteerd: ouder nam over'); }
    if (a === 'ziek') { st.open = null; return actie('zetStatus', [id, 'ziek', st.pin], 'Genoteerd: ziek, telt als gedaan'); }
    if (a === 'matig') { st.open = null; return actie('beoordeel', [id, 'matig', st.pin], 'Genoteerd: ' + getal(st.data.aftrek) + ' punt aftrek'); }
    if (a === 'goed') { st.open = null; return actie('beoordeel', [id, '', st.pin], 'Aftrek weggehaald'); }
    if (a === 'open') { st.open = null; return actie('zetStatus', [id, 'open', st.pin], 'Teruggezet naar open'); }
  });

  document.addEventListener('change', e => {
    const s = e.target;
    if (s.dataset && s.dataset.actie === 'geef' && s.value) {
      st.open = null;
      actie('wijsToe', [s.dataset.id, s.value, st.pin], 'Taak gegeven aan ' + s.value);
    }
  });

  $('pinvak').addEventListener('submit', async e => {
    e.preventDefault();
    const pin = $('pin').value.trim();
    let ok = false;
    try { ok = await roep('controleerPin', pin); } catch (x) {}
    if (!ok) { $('pinfout').hidden = false; return; }
    st.pin = pin; $('pin').value = ''; $('pinfout').hidden = true; $('pinvak').hidden = true;
    try { sessionStorage.setItem('klusjes-pin', pin); } catch (x) {}
    meld('Ouder-modus aan. Tik op ⋯ bij een taak voor meer opties.');
    teken();
  });

  $('demo').hidden = !DEMO;
  if (DEMO) $('demo').textContent = window.KLUSJES_DEMO_TEKST || 'Voorbeeld met nepgegevens.';
  laad();
  // elke 5 minuten verversen, zodat rode taken en afvinkingen van anderen zichtbaar worden
  setInterval(laad, 5 * 60 * 1000);
})();
</script>
</body>
</html>
